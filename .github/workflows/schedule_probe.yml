name: Temporary schedule registration probe
on:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record scheduler event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 -c 'import os,datetime; print("DEBUG-bf-schedule",os.environ["EVENT_NAME"],datetime.datetime.now(datetime.timezone.utc).isoformat())'
