name: Breadfast Telegram watcher
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      full_scan:
        description: Scan all advertised subcategories now
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: breadfast-alert-state
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREADFAST_STATE_DIR: ${{ github.workspace }}/state
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      BREADFAST_FORCE_FULL: ${{ inputs.full_scan }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate Telegram configuration
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
      - name: Restore alert history
        id: restore
        run: python3 github_state.py load
      - name: Check prices and send new discounts
        run: python3 run_once.py
      - name: Persist acknowledged and pending alerts
        if: always() && steps.restore.outcome == 'success'
        run: python3 github_state.py save
